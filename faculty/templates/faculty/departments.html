{% extends 'faculty/base.html' %}

{% block content %}
<h1>Кафедри</h1>

{% for department in departments %}
    <h2>{{ department.name }}</h2>
    <p>Завідувач: {{ department.head }}</p>
    <p>Випускова для:
    {% for program in department.programs.all %}
        {{ program.name }}
    {% endfor %}
    </p>
{% endfor %}
{% endblock %}
